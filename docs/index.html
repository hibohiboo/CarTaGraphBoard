<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarTaGraphBoard</title>
  <!-- docs/ の Markdown をそのまま表示するだけのビューア。動かし方は start.md「スマホで読む」 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'CarTaGraphBoard',
      homepage: 'index.md',
      relativePath: true,
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      auto2top: true,
      subMaxLevel: 2,
      search: { placeholder: '検索', noData: '見つかりません' },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
